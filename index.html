<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fellowship in Jesus Christ</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg-gradient"></div>

<header>
  <div class="header-inner">
    <h1>✝️ Fellowship in Jesus Christ</h1>
    <p class="subtitle">Where two or three gather in my name, there am I with them. <span>— Matthew 18:20</span></p>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Loading...</span>
      <span class="last-updated" id="lastUpdated"></span>
    </div>
  </div>
</header>

<main>
  <div id="feed">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading messages...</p>
    </div>
  </div>
</main>

<footer>
  <p>Made with ❤️ for family · Auto-updates from WhatsApp</p>
</footer>

<script src="app.js"></script>
</body>
</html>
